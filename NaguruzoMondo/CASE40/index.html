<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naguruzo Mondo CASE40</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at top, rgba(255, 209, 102, 0.35), transparent 35%),
                linear-gradient(180deg, #f7f4ea 0%, #ece7db 100%);
        }

        .case40-start {
            appearance: none;
            border: 0;
            border-radius: 999px;
            padding: 18px 44px;
            background: linear-gradient(135deg, #1f7a4d 0%, #2fa56a 100%);
            color: #ffffff;
            font: 700 20px/1 "Segoe UI", sans-serif;
            letter-spacing: 0.08em;
            text-transform: lowercase;
            cursor: pointer;
            box-shadow: 0 18px 40px rgba(31, 122, 77, 0.24);
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        .case40-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 22px 46px rgba(31, 122, 77, 0.3);
        }

        .case40-start:active {
            transform: translateY(0);
        }

        .case40-start:disabled {
            cursor: default;
            opacity: 0.45;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <button class="case40-start" id="openCase40" type="button">start</button>

    <script>
        const CASE40_DEPLOY_URL = "https://case40-live-2d17a9e4deda.herokuapp.com/";
        const isPlaceholder = CASE40_DEPLOY_URL.includes("your-case40-app");
        const startButton = document.getElementById("openCase40");

        const goToCase40 = () => {
            window.location.replace(CASE40_DEPLOY_URL);
        };

        if (isPlaceholder) {
            startButton.disabled = true;
        } else {
            startButton.addEventListener("click", goToCase40);
            window.setTimeout(goToCase40, 120);
        }
    </script>
</body>
</html>
