<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="case.css">
    <title>Naguruzo Mondo</title>
</head>
<body>
    <script src="../message-dialog.js"></script>

    <div id="canvas">
        <canvas id="board" width="1920" height="1920" aria-label="問題の盤面"></canvas>
    </div>

    <div style="display: flex; justify-content: center; align-items: center; flex-direction: column;">
        <div class="quiz-container">
            <div id="remainingAttempts" class="quiz-info">残り解答回数: 3</div>
            <input type="text" id="answerInput" class="quiz-input" placeholder="解答を入力" aria-label="解答">
            <button id="submitAnswer" class="quiz-button">決定</button>
        </div>
        <div id="canvas-container"></div>
    </div>

    <footer class="back-to-top-footer">
      <a href="../index.html" class="back-to-top-link">一覧に戻る</a>
    </footer>

    <script src="strokes.js"></script>
    <script src="main.js"></script>
</body>
</html>
