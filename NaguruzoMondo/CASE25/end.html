<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <link rel="stylesheet" href="../style.css">
    <title>Naguruzo Mondo - ゲーム完了</title>
    <style>
        /* エンディング専用のスタイル */
        body {
            background-color: #e9ecef !important;
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            box-sizing: border-box !important;
        }
        
        .ending-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        .ending-title {
            font-size: 3rem;
            color: #333;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        .ending-subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 40px;
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        .dialogue-section {
            margin: 50px 0;
        }

        .dialogue-item {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            opacity: 0;
            transform: translateX(-50px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        .dialogue-item.show {
            opacity: 1;
            transform: translateX(0);
        }

        .dialogue-item.reverse {
            flex-direction: row-reverse;
            transform: translateX(50px);
        }

        .dialogue-item.reverse.show {
            transform: translateX(0);
        }

        .character-image {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #6c757d;
            object-fit: cover;
            flex-shrink: 0;
            background: linear-gradient(135deg, #6c757d, #495057);
        }

        .speech-bubble {
            flex: 1;
            padding: 20px;
            margin: 0 20px;
            background: #f8f9fa;
            border-radius: 15px;
            border: 2px solid #e9ecef;
            font-size: 16px;
            line-height: 1.5;
            color: #333;
        }

        .music-section {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            margin: 40px 0;
            text-align: center;
        }

        .music-title {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .music-description {
            font-size: 1rem;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            padding-bottom: 177.78%; /* 9:16のアスペクト比 (縦動画) */
            height: 0;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }

        .share-section {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            margin: 40px 0;
        }

        .share-title {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 15px;
        }

        .share-description {
            font-size: 1rem;
            color: #666;
            margin-bottom: 25px;
        }

        .share-button {
            display: inline-block;
            padding: 12px 30px;
            font-size: 16px;
            color: #fff;
            background: linear-gradient(135deg, #1DA1F2 0%, #0d8bd9 100%);
            border-radius: 10px;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .share-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(29, 161, 242, 0.3);
        }



        @media (max-width: 600px) {
            body {
                padding: 0 10px;
            }
            
            .ending-container {
                padding: 20px 15px;
                margin: 0 auto;
                max-width: 100%;
                text-align: center;
            }
            
            .ending-title {
                font-size: 2rem;
                line-height: 1.2;
                text-align: center;
                margin: 0 auto 10px auto;
            }
            
            .ending-subtitle {
                font-size: 1rem;
                line-height: 1.4;
                text-align: center;
                margin: 0 auto 30px auto;
            }
            
            .dialogue-section {
                margin: 30px auto;
                text-align: center;
            }
            
            .dialogue-item {
                flex-direction: column;
                text-align: center;
                padding: 15px;
                margin: 15px auto 20px auto;
                max-width: 100%;
                align-items: center;
            }
            
            .dialogue-item.reverse {
                flex-direction: column;
            }
            
            .character-image {
                margin-bottom: 15px;
                margin-left: auto;
                margin-right: auto;
            }
            
            .speech-bubble {
                margin: 0 auto;
                padding: 15px;
                font-size: 14px;
                line-height: 1.4;
                text-align: center;
                max-width: 100%;
            }
            
            .music-section {
                padding: 20px 15px;
                margin: 20px auto;
                text-align: center;
                max-width: 100%;
            }
            
            .music-title {
                font-size: 1.2rem;
                text-align: center;
                margin: 0 auto 10px auto;
            }
            
            .music-description {
                font-size: 14px;
                text-align: center;
                margin: 0 auto 20px auto;
            }
            
            .video-container {
                max-width: 280px;
                margin: 20px auto;
                padding-bottom: 157.14%; /* モバイル用に少し縮める */
            }
            
            .share-section {
                padding: 20px 15px;
                margin: 20px auto;
                text-align: center;
                max-width: 100%;
            }
            
            .share-title {
                font-size: 1.2rem;
                text-align: center;
                margin: 0 auto 15px auto;
            }
            
            .share-button {
                padding: 10px 20px;
                font-size: 14px;
                display: inline-block;
                margin: 0 auto;
            }
            
            .back-to-top-footer {
                text-align: center;
                margin: 30px auto 20px auto;
                padding: 0 15px;
            }
            
            .back-to-top-link {
                margin: 0 auto;
                display: inline-block;
            }
        }
    </style>
</head>
<body>
    <div class="ending-container">
        <h1 class="ending-title">完了</h1>
        <div class="ending-subtitle">
            あなたはCASE25を完全にクリアした。
        </div>

        <div class="music-section">
            <div class="music-title">エンディングテーマ<br>Naguruzo End</div>
            <div class="music-description">music lyrics vocal & mix: ひつじ</div>
            <!-- YouTube埋め込みプレーヤー（レスポンシブ対応） -->
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/Nc97Ngf1e4g" title="Naguruzo End" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </div>

        <div class="dialogue-section" id="dialogueSection">
            <!-- JavaScriptで動的にキャラクターの会話を表示 -->
        </div>

        <div class="share-section">
            <div class="share-title">成果をシェアしよう！</div>
            <a href="#" id="shareButton" class="share-button">
                Xで共有
            </a>
        </div>
    </div>

    <footer class="back-to-top-footer">
        <a href="../index.html" class="back-to-top-link">一覧に戻る</a>
    </footer>

    <script src="end.js"></script>
</body>
</html>
