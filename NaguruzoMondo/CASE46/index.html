<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.8.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.7.3/addons/p5.dom.min.js"></script>
    <link rel="stylesheet" href="../style.css">
    <title>Naguruzo Mondo</title>
</head>
<body>
    <style>
        body.worldline-active {
            background: #fff;
            overflow-x: auto;
        }

        body.worldline-dim::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: var(--worldline-page-darkness, 1);
            background:
                radial-gradient(circle at 50% 48%, rgba(42, 54, 92, 0.22), transparent 28%),
                #000;
        }

        #worldlineStage {
            position: relative;
            z-index: 1;
            width: 100%;
            min-height: 100vh;
            overflow: visible;
        }

        .worldline-root {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            will-change: transform, opacity;
            transform-origin: top center;
        }

        .worldline-root > div {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #worldlineRoot #canvas {
            width: 100%;
            align-items: center;
        }

        .worldline-root [data-worldline-canvas-container] {
            margin-bottom: 20px;
        }

        .worldline-root .quiz-container {
            box-sizing: border-box;
            width: min(330px, calc(100vw - 40px));
            padding: 22px;
        }

        .worldline-root .quiz-input {
            padding: 12px 14px;
        }

        .worldline-root .back-to-top-footer {
            width: 100%;
            text-align: center;
        }

        #worldlineClone {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            z-index: 5;
        }

        body.worldline-active #worldlineClone {
            display: block;
        }

        body.worldline-settled #worldlineClone {
            pointer-events: none;
        }

        body.worldline-settled #worldlineClone canvas,
        body.worldline-settled #worldlineClone input,
        body.worldline-settled #worldlineClone button,
        body.worldline-settled #worldlineClone a,
        body.worldline-settled #worldlineClone [role="button"] {
            pointer-events: auto;
        }

        body.worldline-merged #worldlineClone,
        body.worldline-merged #worldlineClone canvas,
        body.worldline-merged #worldlineClone input,
        body.worldline-merged #worldlineClone button,
        body.worldline-merged #worldlineClone a,
        body.worldline-merged #worldlineClone [role="button"] {
            pointer-events: none;
        }

        body.worldline-merged #worldlineClone .quiz-container,
        body.worldline-merged #worldlineClone .back-to-top-footer,
        body.worldline-merged #worldlineClone [data-worldline-canvas-container] {
            display: none !important;
        }

        body.worldline-dim .quiz-info,
        body.worldline-dim .back-to-top-link {
            color: #e8ecff;
            text-shadow: 0 0 8px rgba(120, 150, 255, 0.38);
        }

        body.worldline-dim canvas,
        body.worldline-dim .quiz-input,
        body.worldline-dim .quiz-button {
            box-shadow: 0 0 24px rgba(84, 118, 255, 0.18);
        }

        body.worldline-splitting #worldlineRoot,
        body.worldline-splitting #worldlineClone,
        body.worldline-reuniting #worldlineRoot,
        body.worldline-reuniting #worldlineClone {
            filter: saturate(1.15) contrast(1.08);
            mix-blend-mode: screen;
        }
    </style>

    <div id="worldlineStage">
        <div id="worldlineRoot" class="worldline-root">
            <div id="canvas"></div>

            <div>
                <div id="canvas-container"></div>
                <div class="quiz-container">
                    <div id="remainingAttempts" class="quiz-info">残り解答回数: 3</div>
                    <input type="text" id="answerInput" class="quiz-input" placeholder="解答を入力">
                    <button id="submitAnswer" class="quiz-button">決定</button>
                </div>
            </div>

            <footer class="back-to-top-footer">
              <a href="../index.html" class="back-to-top-link">一覧に戻る</a>
            </footer>
        </div>
        <div id="worldlineClone" class="worldline-root" aria-hidden="true"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
