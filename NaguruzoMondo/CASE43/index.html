<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <link rel="stylesheet" href="../style.css">
    <title>Naguruzo Mondo</title>
</head>
<body>

    <div id="canvas" style="display: flex; justify-content: center; align-items: center; flex-direction: column;"></div>

    <div style="display: flex; justify-content: center; align-items: center; flex-direction: column;">
        <div id="canvas-container"></div>
        <div class="quiz-container">
            <div id="remainingAttempts" class="quiz-info">残り解答回数: 3</div>
            <input type="text" id="answerInput" class="quiz-input" placeholder="解答をひらがなで入力">
            <button id="submitAnswer" class="quiz-button">決定</button>
        </div>
    </div>

    <footer class="back-to-top-footer">
      <a href="../index.html" class="back-to-top-link">一覧に戻る</a>
    </footer>

    <script type="module">
        const threeCandidates = [
            './vendor/three.module.js',
            'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js',
            'https://unpkg.com/three@0.161.0/build/three.module.js'
        ];
        const cannonCandidates = [
            './vendor/cannon-es.js',
            'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js',
            'https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js'
        ];

        let threeModule = null;
        let cannonModule = null;

        for (const candidate of threeCandidates) {
            try {
                threeModule = await import(candidate);
                break;
            } catch (error) {
                console.warn(`Three.js load failed: ${candidate}`, error);
            }
        }

        if (!threeModule) {
            const host = document.getElementById('canvas');
            if (host) {
                host.textContent = 'Three.js の読み込みに失敗しました。ネットワーク接続を確認してください。';
                host.style.padding = '24px';
                host.style.color = '#fff';
                host.style.background = '#7a1d1d';
                host.style.borderRadius = '16px';
            }
            throw new Error('Three.js could not be loaded from any configured source.');
        }

        for (const candidate of cannonCandidates) {
            try {
                cannonModule = await import(candidate);
                break;
            } catch (error) {
                console.warn(`cannon-es load failed: ${candidate}`, error);
            }
        }

        if (!cannonModule) {
            const host = document.getElementById('canvas');
            if (host) {
                host.textContent = 'cannon-es の読み込みに失敗しました。ネットワーク接続を確認してください。';
                host.style.padding = '24px';
                host.style.color = '#fff';
                host.style.background = '#7a1d1d';
                host.style.borderRadius = '16px';
            }
            throw new Error('cannon-es could not be loaded from any configured source.');
        }

        window.THREE = threeModule;
        window.CANNON = cannonModule;
        await import('./main.js');
    </script>
</body>
</html>
