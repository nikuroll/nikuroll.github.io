<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="case.css">
    <title>Naguruzo Mondo</title>
</head>
<body>
    <script src="../message-dialog.js"></script>
    <div id="canvas">
        <div class="excavation-status">
            <span id="score">Score: 100/100</span>
            <div class="fossil-meter" role="meter" aria-label="化石の露出率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="exposure-meter"></span></div>
            <div class="fossil-meter damage-meter" role="meter" aria-label="化石の損傷率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="damage-meter"></span></div>
        </div>
        <canvas id="dig-board" width="640" height="640" aria-label="化石の発掘盤面"></canvas>
        <div class="tools" role="group" aria-label="発掘道具">
            <button type="button" data-tool="scan" aria-pressed="false">◎ スキャン</button>
            <button type="button" data-tool="hammer" aria-pressed="true">⚒ ハンマー</button>
            <button type="button" data-tool="drill" aria-pressed="false">▼ ドリル</button>
        </div>
    </div>
    <div class="case-controls">
        <div id="canvas-container"></div>
        <div class="quiz-container">
            <div id="remainingAttempts" class="quiz-info">残り解答回数: 3</div>
            <input type="text" id="answerInput" class="quiz-input" placeholder="解答を入力" aria-label="解答">
            <button id="submitAnswer" class="quiz-button">決定</button>
        </div>
    </div>
    <footer class="back-to-top-footer"><a href="../index.html" class="back-to-top-link">一覧に戻る</a></footer>
    <script src="images/fossil-mask.js"></script>
    <script src="excavation.js"></script>
    <script src="effects.js"></script>
    <script src="main.js"></script>
</body>
</html>
